apiVersion: v1
kind: ServiceAccount
metadata:
  name: raid-verifier
  namespace: demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verifier-data
  namespace: demo
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: __STORAGE_CLASS__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raid-verifier
  namespace: demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: raid-verifier
  template:
    metadata:
      labels:
        app: raid-verifier
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: raid-verifier
        image: raid-verifier:local
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
      serviceAccountName: raid-verifier
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: verifier-data
      imagePullSecrets: []
---
apiVersion: v1
kind: Service
metadata:
  name: raid-verifier
  namespace: demo
spec:
  selector:
    app: raid-verifier
  ports:
  - port: 8080
    targetPort: 8080
