apiVersion: apps/v1
kind: Deployment
metadata:
  name: bossraid-dashboard
  namespace: demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: bossraid-dashboard
  template:
    metadata:
      labels:
        app: bossraid-dashboard
    spec:
      serviceAccountName: bossraid-dashboard
      terminationGracePeriodSeconds: 60
      containers:
      - name: bossraid-dashboard
        image: bossraid-dashboard:local
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      imagePullSecrets: []
---
apiVersion: v1
kind: Service
metadata:
  name: bossraid-dashboard
  namespace: demo
spec:
  selector:
    app: bossraid-dashboard
  ports:
  - port: 8080
    targetPort: 8080
