apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: raid
  namespace: kafka
  labels:
    strimzi.io/cluster: raid
spec:
  replicas: 1
  roles:
  - controller
  - broker
  storage:
    type: jbod
    volumes:
    - id: 0
      type: persistent-claim
      size: 10Gi
      deleteClaim: true
      class: __STORAGE_CLASS__
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 3Gi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: raid
  namespace: kafka
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    jvmOptions:
      -Xms: 512m
      -Xmx: 768m
      -XX:
        MaxDirectMemorySize: 256m
    version: 4.0.0
    metadataVersion: 4.0-IV3
    listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      transaction.max.timeout.ms: 900000
      log.retention.hours: 24
  entityOperator:
    topicOperator: {}
