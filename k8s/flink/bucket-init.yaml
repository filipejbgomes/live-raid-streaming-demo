apiVersion: batch/v1
kind: Job
metadata:
  name: bossraid-bucket-init
  namespace: flink
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc:RELEASE.2025-04-16T18-13-26Z
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: bossraid-object-storage
              key: access-key
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bossraid-object-storage
              key: secret-key
        command:
        - /bin/sh
        - -ec
        - mc alias set bossraid http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD";
          mc mb --ignore-existing bossraid/flink
