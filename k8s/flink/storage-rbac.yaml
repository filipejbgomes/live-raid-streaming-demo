apiVersion: v1
kind: ServiceAccount
metadata:
  name: raid-flink
  namespace: flink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: raid-flink
  namespace: flink
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - configmaps
  verbs:
  - '*'
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: raid-flink
  namespace: flink
subjects:
- kind: ServiceAccount
  name: raid-flink
  namespace: flink
roleRef:
  kind: Role
  name: raid-flink
  apiGroup: rbac.authorization.k8s.io
