apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: object-storage
  namespace: flink
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: __STORAGE_CLASS__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: flink
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        args:
        - server
        - /data
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: bossraid-object-storage
              key: access-key
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bossraid-object-storage
              key: secret-key
        ports:
        - containerPort: 9000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: object-storage
      imagePullSecrets: []
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: flink
spec:
  selector:
    app: minio
  ports:
  - port: 9000
    targetPort: 9000
