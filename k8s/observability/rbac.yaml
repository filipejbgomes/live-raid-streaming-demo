apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: raid-telemetry
  namespace: flink
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: raid-telemetry
  namespace: flink
subjects:
- kind: ServiceAccount
  name: raid-verifier
  namespace: demo
roleRef:
  kind: Role
  name: raid-telemetry
  apiGroup: rbac.authorization.k8s.io
